services:
  - type: web
    name: quant-factor-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TUSHARE_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
