[database]
# Database configuration
driver = sqlite
host = localhost
port = 5432
database = quant_factor.db
username = 
password = 

[data_source]
# Data source configuration
# Options: akshare, tushare, custom
provider = akshare
tushare_token = 
cache_enabled = true
cache_dir = ./outputs/cache

[factor]
# Factor configuration
neutralization = true
standardization = true
winsorize = true
winsorize_method = mad
winsorize_threshold = 3

[backtest]
# Backtest configuration
initial_capital = 10000000
commission = 0.0003
slippage = 0.0001
benchmark = 000300.SH

[portfolio]
# Portfolio configuration
max_position_size = 0.05
min_position_size = 0.01
rebalance_freq = 5
# days
max_stocks = 50

[risk]
# Risk management configuration
max_drawdown_limit = 0.15
var_confidence = 0.95
position_limit = 0.2

[logging]
# Logging configuration
log_level = INFO
log_file = ./outputs/logs/quant_strategy.log
