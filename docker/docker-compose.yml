version: '3.8'

services:
  quant-strategy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: quant_factor_strategy
    volumes:
      - ../outputs:/app/outputs
      - ../config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
    command: python scripts/run_pipeline.py

  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant123
      POSTGRES_DB: quant_factor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
